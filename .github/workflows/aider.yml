name: Aider Coding Agent

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  aider:
    # Handles both issue creation (github.event.issue.body) AND comments (github.event.comment.body)
    if: >-
      github.actor == 'Sayed632' && (
        startsWith(github.event.issue.body, 'aider:') ||
        startsWith(github.event.comment.body, 'aider:') ||
        contains(github.event.issue.labels.*.name, 'aider')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat pytest

      - name: Run Aider Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract instruction from issue body or comment body
          RAW_BODY="${{ github.event.comment.body || github.event.issue.body }}"
          CLEAN_PROMPT=$(echo "$RAW_BODY" | sed 's/^aider://gi')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="aider-fix-issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME

          aider --model gemini/gemini-2.5-flash \
                --message "$CLEAN_PROMPT" \
                --test-cmd "pytest" \
                --auto-test \
                --auto-commits \
                --yes

          if [ -n "$(git status --porcelain)" ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main || git rev-parse origin/master)" ]; then
            git push origin $BRANCH_NAME
            gh pr create --title "AI Fix: Issue #${{ github.event.issue.number }}" \
                         --body "Automated PR generated by Aider agent for Issue #${{ github.event.issue.number }}." \
                         --head $BRANCH_NAME \
                         --base main
          fi
