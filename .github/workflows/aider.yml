name: AI Coding Agent

# How to use (from your phone, no laptop needed):
#   1. Open a new Issue and write:  aider: <what you want built or fixed>
#   2. The agent creates a branch, writes the code, runs tests, and opens a Pull Request.
#   3. To keep refining, comment on that Pull Request starting with "aider: ..."
#      and the agent will push more commits to the same branch.
#
# Uses Aider (https://aider.chat) + Google Gemini (free tier) as the model.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: aider-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.actor == 'Sayed632' &&
      github.actor != 'github-actions[bot]' &&
      (
        startsWith(github.event.comment.body, 'aider:') ||
        startsWith(github.event.comment.body, 'Aider:') ||
        startsWith(github.event.issue.body, 'aider:') ||
        startsWith(github.event.issue.body, 'Aider:') ||
        contains(github.event.issue.labels.*.name, 'aider')
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Aider Agent
        id: aider
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          RAW_BODY="${COMMENT_BODY:-$ISSUE_BODY}"
          CLEAN_PROMPT=$(printf '%s' "$RAW_BODY" | sed -E 's/^[Aa]ider:[[:space:]]*//')
          IS_PR=$(gh issue view "$ISSUE_NUMBER" --json isPullRequest -q .isPullRequest 2>/dev/null || echo "false")

          if [ "$IS_PR" = "true" ]; then
            # A comment on an existing PR: keep iterating on its branch
            BRANCH_NAME=$(gh pr view "$ISSUE_NUMBER" --json headRefName -q .headRefName)
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
          else
            # A new issue or comment: start a fresh branch for it
            BRANCH_NAME="aider-issue-${ISSUE_NUMBER}"
            git fetch origin "$BRANCH_NAME" 2>/dev/null && git checkout "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME"
          fi
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "is_pr=$IS_PR" >> "$GITHUB_OUTPUT"

          set +e
          aider --model gemini/gemini-2.5-flash \
                --message "$CLEAN_PROMPT" \
                --test-cmd "pytest" \
                --auto-test \
                --auto-commits \
                --yes-always \
                --no-check-update
          AIDER_EXIT=$?
          set -e
          echo "aider_exit=$AIDER_EXIT" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify "origin/$BRANCH_NAME" >/dev/null 2>&1; then
            NEW_COMMITS=$(git rev-list "origin/$BRANCH_NAME..$BRANCH_NAME" --count)
          else
            NEW_COMMITS=$(git rev-list "$BRANCH_NAME" --count)
          fi
          echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"

          if [ "$NEW_COMMITS" -gt 0 ]; then
            git push origin "$BRANCH_NAME"
          fi

      - name: Open Pull Request (new work only)
        if: steps.aider.outputs.is_pr != 'true' && steps.aider.outputs.new_commits > '0'
        run: |
          gh pr create \
            --title "AI: Issue #${ISSUE_NUMBER}" \
            --body "Automated changes generated by the coding agent for #${ISSUE_NUMBER}." \
            --head "${{ steps.aider.outputs.branch_name }}" \
            --base main || true

      - name: Report success back on the issue
        if: steps.aider.outputs.new_commits > '0'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Done — pushed changes to \`${{ steps.aider.outputs.branch_name }}\`. Check the Pull Request for the diff."

      - name: Report no-changes / failure back on the issue
        if: steps.aider.outputs.new_commits == '0'
        run: |
          if [ "${{ steps.aider.outputs.aider_exit }}" != "0" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ The agent hit an error and made no changes. Check the workflow run logs for details, or try rephrasing your request."
          else
            gh issue comment "$ISSUE_NUMBER" --body "ℹ️ The agent ran but made no code changes. Try giving more specific instructions."
          fi
